name: Build Outcoin Electrum

on:
  push:
    branches: [ outcoin-master, main ]
  pull_request:
    branches: [ outcoin-master, main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsecp256k1-dev python3-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=electrum --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsecp256k1-dev python3-dev python3-pyqt6
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Build Linux AppImage
      run: |
        cd contrib/build-linux/appimage
        chmod +x build.sh
        ./build.sh
    
    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v3
      with:
        name: outcoin-electrum-linux
        path: contrib/build-linux/appimage/dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed run_electrum
        mv dist/run_electrum.exe dist/outcoin-electrum.exe
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v3
      with:
        name: outcoin-electrum-windows
        path: dist/outcoin-electrum.exe

  build-macos:
    runs-on: macos-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        brew install qt6 libsecp256k1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Build macOS app
      run: |
        pyinstaller --onefile --windowed run_electrum
        mv dist/run_electrum dist/outcoin-electrum
    
    - name: Upload macOS app
      uses: actions/upload-artifact@v3
      with:
        name: outcoin-electrum-macos
        path: dist/outcoin-electrum

  build-android:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk android-sdk
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install python-for-android
    
    - name: Build Android APK
      run: |
        cd contrib/android
        chmod +x build.sh
        ./build.sh
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v3
      with:
        name: outcoin-electrum-android
        path: contrib/android/dist/*.apk

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Create release assets
      run: |
        mkdir -p release-assets
        cp outcoin-electrum-linux/*.AppImage release-assets/
        cp outcoin-electrum-windows/*.exe release-assets/
        cp outcoin-electrum-macos/* release-assets/
        tar -czf release-assets/outcoin-electrum-source.tar.gz --exclude='.git' .
    
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release-assets/
        asset_name: outcoin-electrum-${{ github.event.release.tag_name }}
        asset_content_type: application/zip 