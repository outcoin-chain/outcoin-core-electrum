# Outcoin ElectrumX Server Configuration

# Network and Coin
COIN = Outcoin
NET = mainnet

# Database
DB_DIRECTORY = /tmp/outcoin-electrumx-db
DB_ENGINE = leveldb

# RPC connection to Outcoin Core
DAEMON_URL = http://outcoin:password@127.0.0.1:19205

# Server binding
HOST = 127.0.0.1
TCP_PORT = 50001
SSL_PORT = 50002

# Logging
LOG_LEVEL = info

# Services
SERVICES = tcp://:50001,ssl://:50002,ws://:50003,wss://:50004

# Peer discovery
PEER_DISCOVERY = self
PEER_ANNOUNCE = ""

# Cache settings
CACHE_MB = 1200

# Initial sync
INITIAL_CONCURRENT = 10

# Session limits
SESSION_TIMEOUT = 600
MAX_SESSIONS = 1000

# Banner
BANNER_FILE = /tmp/outcoin-banner.txt

# Donation address (optional)
DONATION_ADDRESS = "" 